name: Refresh channel list

on:
  schedule:
    # Every 30 minutes. Live events come and go, so the list is rebuilt often —
    # but nothing here runs at request time, which is what keeps the addon
    # working when the source site is down.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Rebuild matches.js
        run: node tools/refresh.js

      - name: Validate
        run: |
          node -e '
            import("./matches.js").then(function (m) {
              const n = (m.MATCHES || []).length;
              console.log("entries:", n);
              for (const x of m.MATCHES || []) {
                if (!x.id || !x.url) throw new Error("entry missing id/url: " + JSON.stringify(x));
                if (!/^https:/i.test(x.url)) throw new Error("non-https url: " + x.url);
              }
            }).catch(function (e) { console.error(e); process.exit(1); });
          '

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- matches.js; then
            echo "no change"
            exit 0
          fi
          git add matches.js
          git commit -m "Refresh channel list ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      # Committing also keeps the repository active, which stops GitHub from
      # disabling this scheduled workflow after 60 days.
